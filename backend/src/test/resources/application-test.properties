# Integration tests run the real Flyway migrations against in-memory H2 in MySQL compatibility mode.
spring.datasource.url=jdbc:h2:mem:ems_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
# Fails the test context if the JPA entities and the migration-created schema disagree.
spring.jpa.hibernate.ddl-auto=validate

app.cors.allowed-origins=http://localhost:5173
app.admin.username=test-admin
app.admin.password=test-password-123
app.demo-data.enabled=false
