spring.application.name=employee-management-backend

# Reads KEY=VALUE pairs from a .env file next to the backend or in the repository root.
# Real environment variables take precedence over values in the file.
spring.config.import=optional:file:./.env[.properties],optional:file:../.env[.properties]

server.port=${SERVER_PORT:8080}

# ---- Database (MySQL) ----
# createDatabaseIfNotExist only takes effect when DB_USERNAME has the CREATE privilege;
# otherwise create the database first with database/setup.sql.
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:employee_management}?createDatabaseIfNotExist=true&characterEncoding=UTF-8
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Flyway owns the schema (src/main/resources/db/migration); Hibernate never alters tables.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ---- Sessions and errors ----
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.error.include-stacktrace=never
server.error.include-message=never

# ---- Application ----
app.cors.allowed-origins=${FRONTEND_ORIGIN:http://localhost:5173}
app.admin.username=${ADMIN_USERNAME:}
app.admin.password=${ADMIN_PASSWORD:}
app.demo-data.enabled=${SEED_DEMO_DATA:false}

# ---- API documentation ----
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.csrf.enabled=true
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
